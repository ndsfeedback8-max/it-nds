<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Issue Reporting</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1b1e27; --muted:#767b8a;
  --border:#e7e9f0; --accent:#4f46e5; --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--card)); --accent-fg:#ffffff;
  --danger:#e0332f; --danger-soft:#fdeaea;
  --warn:#c8720a; --warn-soft:#fdf3e2;
  --ok:#0e8f52; --ok-soft:#e6f7ee;
  --radius:14px; --radius-sm:9px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px;}
h1{font-size:1.4rem;margin:4px 0 2px;font-weight:700;letter-spacing:-0.01em;}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:22px;line-height:1.4;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  margin-bottom:16px;box-shadow:0 1px 2px rgba(20,20,43,.03);}
label{display:block;font-size:.82rem;font-weight:600;color:var(--text);margin:16px 0 6px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--card);}
textarea{min-height:90px;resize:vertical;}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:12px 18px;font-size:.95rem;font-weight:600;
  transition:opacity .15s, transform .05s;}
button:active{transform:scale(.98);}
.btn-primary{background:var(--accent);color:var(--accent-fg);width:100%;margin-top:18px;}
.btn-primary:hover{opacity:.92;}
.btn-primary:disabled{opacity:.5;cursor:default;}
.btn-ghost{background:var(--accent-soft);color:var(--accent);border:1px solid transparent;}
.btn-ghost:hover{opacity:.85;}
.row{display:flex;gap:10px;align-items:center;}
.grow{flex:1;}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
.badge-open{background:var(--danger-soft);color:var(--danger);}
.badge-in-progress{background:var(--warn-soft);color:var(--warn);}
.badge-resolved{background:var(--ok-soft);color:var(--ok);}
.ticket{border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;margin-bottom:10px;background:var(--card);}
.ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ticket-meta{color:var(--muted);font-size:.78rem;margin-top:5px;}
.ticket-desc{margin-top:9px;font-size:.9rem;line-height:1.45;}
.status-select{width:auto;padding:7px 10px;font-size:.78rem;margin-top:11px;}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:.9rem;background:var(--card);
  border:1px dashed var(--border);border-radius:var(--radius);}
.loc-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
.loc-item:last-child{border-bottom:none;}
.loc-name{font-weight:600;}
.loc-count{color:var(--muted);font-size:.8rem;}
.qr-modal-bg{position:fixed;inset:0;background:rgba(20,20,43,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.qr-modal{background:var(--card);border-radius:var(--radius);padding:26px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(20,20,43,.25);}
.qr-modal canvas,.qr-modal img{max-width:100%;border-radius:8px;}
#qrCanvas{display:flex;justify-content:center;}
.qr-modal .url{font-size:.72rem;color:var(--muted);word-break:break-all;margin:12px 0;}
.msg{text-align:center;padding:60px 16px;}
.msg .big{font-size:2.4rem;}
.add-row{display:flex;gap:8px;margin-top:6px;}
.add-row input{flex:1;}
.add-row button{white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--accent);font-size:.8rem;padding:0;font-weight:600;}
table{width:100%;border-collapse:collapse;}
:root[data-theme="dark"]{--bg:#0e1016;--card:#171a23;--text:#e8eaf0;--muted:#8d92a3;--border:#252937;
  --danger-soft:#3b1c1e;--warn-soft:#3a2a12;--ok-soft:#0f3022;}
.card,.ticket{transition:box-shadow .15s,border-color .15s;}
.ticket:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,20,43,.06);}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-right:1px solid var(--border);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;padding:2px 8px 20px;}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800;}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;transition:.15s;}
.nav:hover{background:var(--bg);color:var(--text);}
.nav.active{background:var(--accent-soft);color:var(--accent);}
.nav svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-sep{height:1px;background:var(--border);margin:10px 4px;}
.side-foot{margin-top:auto;}
.side-foot a{text-decoration:none;}
.main{padding:30px 34px 60px;max-width:1040px;width:100%;min-width:0;}
.ct{font-size:1rem;margin:0 0 12px;font-weight:700;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
.stat b{display:block;font-size:1.6rem;letter-spacing:-.02em;}
.stat span{color:var(--muted);font-size:.78rem;font-weight:600;}
.bar-row{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:.85rem;padding:5px 0;}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:8px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:3px solid transparent;}
.sw.on{border-color:var(--text);}
.copy-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.copy-row input{flex:1;font-size:.82rem;}
a.btn-ghost{display:inline-block;text-decoration:none;border-radius:var(--radius-sm);padding:12px 18px;font-size:.95rem;font-weight:600;text-align:center;}
.hist{border-left:2px solid var(--border);margin-left:8px;padding:0 0 16px 18px;position:relative;}
.hist:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);}
.hist b{font-size:.9rem;}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.acts button{padding:12px 6px;font-size:.85rem;}
.acts button.on{background:var(--accent);color:var(--accent-fg);}
@media(max-width:820px){.two{grid-template-columns:1fr;}}
@media(max-width:760px){
  .shell{grid-template-columns:62px 1fr;}
  .side{padding:14px 8px;}
  .nav span,.bt{display:none;}
  .nav{justify-content:center;padding:12px 0;}
  .brand{justify-content:center;padding:2px 0 16px;}
  .main{padding:22px 14px 50px;}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg"><div class="big">⏳</div><p>Loading…</p></div></div>

<script>
const CATEGORIES = ["Hardware","Software","Network/Wi-Fi","Printer","Account/Access","POS Terminal","Other"];
const URGENCY = ["Low","Medium","High","Critical"];
const STATUSES = ["open","in-progress","resolved"];
const URGENCY_HOURS = {Critical:4, High:24, Medium:72, Low:168};

// ========== FIREBASE CONFIG — replace with your own from Firebase console ==========
const firebaseConfig = {
  apiKey: "AIzaSyCA8gPnXDlxN1eWoazJMA9UjC3Zqg88v00",
  authDomain: "itndsticket.firebaseapp.com",
  projectId: "itndsticket",
  storageBucket: "itndsticket.firebasestorage.app",
  messagingSenderId: "403748061583",
  appId: "1:403748061583:web:5bea3c7088517b418f4bfa"
};
// =====================================================================================

let dbError = '';
function loadScript(src){
  return new Promise(res => { const el = document.createElement('script'); el.src = src; el.onload = () => res(true); el.onerror = () => res(false); document.head.appendChild(el); });
}
async function ensureFirebase(){
  if (window.firebase && firebase.firestore) return;
  // primary CDN failed or was blocked — try a fallback mirror
  const base = 'https://cdn.jsdelivr.net/npm/firebase@10.7.1/';
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-firestore-compat.js');
}
function initFirestore(){
  try {
    if (firebaseConfig.apiKey === "YOUR_API_KEY") { dbError = 'The Firebase config still has placeholder values.'; return null; }
    if (!window.firebase || !firebase.firestore) { dbError = 'The Firebase library could not be loaded (offline, or gstatic.com / jsdelivr.net is blocked by a network, ad-blocker or CSP).'; return null; }
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const fdb = firebase.firestore();
    try { fdb.settings({experimentalAutoDetectLongPolling: true, merge: true}); } catch(e){}
    return {
      doc(path){
        const ref = fdb.doc(path);
        return {
          async set(data){ return ref.set(data, {merge:true}); },
          async update(data){ return ref.update(data); },
          async get(){ const snap = await ref.get(); return snap.exists ? {data: snap.data()} : null; }
        };
      },
      collection(path){
        const ref = fdb.collection(path);
        return {
          async get(){ const snap = await ref.get(); return {docs: snap.docs.map(d => ({data: d.data()}))}; }
        };
      }
    };
  } catch(e){ dbError = (e && e.message) || 'Firebase failed to initialise.'; return null; }
}

let db = null;
const params = new URLSearchParams(location.search);
const view = params.get('view'); // 'form' or 'admin' — no other way in

function pageBaseUrl(){
  return location.origin + location.pathname;
}
function formUrl(){ return pageBaseUrl() + '?view=form'; }
function adminUrl(){ return pageBaseUrl() + '?view=admin'; }

async function init(){
  await ensureFirebase();
  db = initFirestore();
  try {
    await loadSettings();
    if (view === 'form') {
      await renderForm();
    } else if (view === 'asset') {
      await renderAssetPage(params.get('id'));
    } else {
      await renderAdmin();
    }
  } catch(e){
    document.getElementById('app').innerHTML = '<div class="msg"><div class="big">⚠️</div><h1>Something went wrong</h1><p class="sub">' + escapeHtml(e && e.message ? e.message : 'Please refresh the page.') + '</p></div>';
  }
}

// ---------- FORM VIEW ----------
async function renderForm(){
  const app = document.getElementById('app');
  const locations = db ? await fetchAll('locations') : [];
  const assets = db ? await fetchAll('assets') : [];
  locations.sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const assetOptions = (locId) => {
    const filtered = assets.filter(a => a.locationId === locId);
    return '<option value="">None</option>' + filtered.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
  };
  app.innerHTML = `
    <h1>Report an IT Issue</h1>
    <div class="sub">Fill this in and IT will pick it up.</div>
    <div class="card">
      <label>Location</label>
      <select id="f_loc">
        ${locations.length ? locations.map(l=>`<option value="${l.id}">${escapeHtml(l.name)}</option>`).join('') : '<option value="">No locations set up yet</option>'}
      </select>
      <label>Related asset (optional)</label>
      <select id="f_asset">${locations.length ? assetOptions(locations[0].id) : '<option value="">None</option>'}</select>
      <label>Person raising the ticket</label>
      <input id="f_name" type="text" placeholder="e.g. Nadeesha Perera">
      <label>Department</label>
      <input id="f_dept" type="text" placeholder="e.g. Sales, Warehouse">
      <label>Request</label>
      <select id="f_cat">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <label>Urgency</label>
      <select id="f_urg">${URGENCY.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
      <label>Issue</label>
      <textarea id="f_desc" placeholder="What's happening? What have you already tried?"></textarea>
      <button class="btn-primary" id="submitBtn">Submit Ticket</button>
      <div id="formMsg" class="ticket-meta" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('f_loc').onchange = (e) => {
    document.getElementById('f_asset').innerHTML = assetOptions(e.target.value);
  };
  document.getElementById('submitBtn').onclick = () => submitTicket(locations, assets);
  const preId = params.get('asset'); const pa = preId && assets.find(x => x.id === preId);
  if (pa) {
    document.getElementById('f_loc').value = pa.locationId;
    document.getElementById('f_asset').innerHTML = assetOptions(pa.locationId);
    document.getElementById('f_asset').value = pa.id;
  }
}

async function submitTicket(locations, assets){
  const locId = document.getElementById('f_loc').value;
  const loc = locations.find(l => l.id === locId);
  const assetId = document.getElementById('f_asset').value;
  const asset = assets.find(a => a.id === assetId);
  const name = document.getElementById('f_name').value.trim();
  const dept = document.getElementById('f_dept').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  const cat = document.getElementById('f_cat').value;
  const urg = document.getElementById('f_urg').value;
  const msgEl = document.getElementById('formMsg');
  if (!locId) { msgEl.textContent = "Please select a location."; msgEl.style.color = 'var(--danger)'; return; }
  if (!desc) { msgEl.textContent = "Please describe the issue."; msgEl.style.color = 'var(--danger)'; return; }
  if (!db) { msgEl.textContent = "This form isn't connected to a database yet — contact the site admin." + (dbError ? " (" + dbError + ")" : ""); msgEl.style.color='var(--danger)'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = "Submitting…";
  const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const createdAt = Date.now();
  try {
    await db.doc('tickets/' + id).set({
      id, locationId: locId, locationName: loc ? loc.name : locId,
      assetId: assetId || null, assetName: asset ? asset.name : null,
      reporterName: name || 'Anonymous', department: dept,
      category: cat, urgency: urg, description: desc,
      status: 'open', assignedTo: '',
      dueBy: createdAt + (URGENCY_HOURS[urg] || 72) * 3600000,
      createdAt
    });
    document.getElementById('app').innerHTML = `
      <div class="msg"><div class="big">✅</div>
      <h1>Ticket submitted</h1>
      <p class="sub">IT has been notified. Thanks for the report!</p></div>`;
  } catch(e){
    btn.disabled = false; btn.textContent = "Submit Ticket";
    msgEl.textContent = "Couldn't submit — please check your connection and try again.";
    msgEl.style.color = 'var(--danger)';
  }
}

// ---------- ADMIN VIEW ----------
let adminTab = 'tickets';
let statusFilter = 'all';
let locFilter = 'all';
let assetLocFilter = 'all';

const SETTINGS = {orgName:'IT Desk', theme:'light', accent:'#4f46e5'};
const ICONS = {
  tickets:'<path d="M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a2.5 2.5 0 0 0 0 5v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2.5 2.5 0 0 0 0-5z"/><path d="M9 8v8"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  assets:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  locations:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const NAV = [
  ['tickets','Tickets','Track, assign and resolve reported issues.'],
  ['reports','Reports','Trends, workload and resolution stats.'],
  ['assets','IT Assets','Keep an inventory of devices per location.'],
  ['locations','Locations & QR','Manage sites and share the report form.'],
  ['settings','Settings','Organisation, SLA targets, appearance and data.']
];
const ACCENTS = ['#4f46e5','#0ea5e9','#0e8f52','#e0332f','#c8720a','#9333ea'];

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function applyAppearance(){
  const dark = SETTINGS.theme === 'dark' || (SETTINGS.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.setProperty('--accent', SETTINGS.accent);
}
async function loadSettings(){
  SETTINGS.theme = lsGet('it_theme') || 'light';
  SETTINGS.accent = lsGet('it_accent') || '#4f46e5';
  applyAppearance();
  if (!db) return;
  try {
    const r = await db.doc('settings/general').get();
    if (r && r.data) {
      if (r.data.orgName) SETTINGS.orgName = r.data.orgName;
      if (r.data.sla) Object.keys(r.data.sla).forEach(k => { if (+r.data.sla[k] > 0) URGENCY_HOURS[k] = +r.data.sla[k]; });
    }
  } catch(e){}
}

async function renderAdmin(){
  const app = document.getElementById('app');
  app.className = 'shell';
  const cur = NAV.find(n => n[0] === adminTab) || NAV[0];
  app.innerHTML = `
    <aside class="side">
      <div class="brand"><div class="logo">IT</div><span class="bt">${escapeHtml(SETTINGS.orgName)}</span></div>
      ${NAV.map(n => `<div class="nav ${adminTab===n[0]?'active':''}" data-tab="${n[0]}" title="${n[1]}"><svg viewBox="0 0 24 24">${ICONS[n[0]]}</svg><span>${n[1]}</span></div>`).join('')}
      <div class="side-foot"><div class="nav-sep"></div>
        <a class="nav" href="${formUrl()}" target="_blank" title="Open public form"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Public form</span></a>
      </div>
    </aside>
    <main class="main">
      <h1>${cur[1]}</h1>
      <div class="sub">${cur[2]}</div>
      <div id="tabBody"></div>
    </main>
  `;
  app.querySelectorAll('.nav[data-tab]').forEach(t => t.onclick = () => { adminTab = t.dataset.tab; renderAdmin(); });
  if (!db) {
    document.getElementById('tabBody').innerHTML = `<div class="empty">Couldn't connect to Firebase. ${escapeHtml(dbError || 'Check the config near the top of the script.')}</div>`;
    return;
  }
  if (adminTab === 'tickets') await renderTicketsTab();
  else if (adminTab === 'reports') await renderReportsTab();
  else if (adminTab === 'assets') await renderAssetsTab();
  else if (adminTab === 'settings') await renderSettingsTab();
  else await renderLocationsTab();
}

async function fetchAll(collection){
  try {
    const snap = await db.collection(collection).get();
    return (snap && snap.docs) ? snap.docs.map(d => d.data) : [];
  } catch(e){ return []; }
}

async function renderTicketsTab(){
  const body = document.getElementById('tabBody');
  const [tickets, locations] = await Promise.all([fetchAll('tickets'), fetchAll('locations')]);
  tickets.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

  const locOptions = ['all', ...locations.map(l=>l.id)];
  body.innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <select id="statusFilter" style="width:auto;">
        <option value="all">All statuses</option>
        ${STATUSES.map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${label(s)}</option>`).join('')}
      </select>
      <select id="locFilter" style="width:auto;">
        <option value="all">All locations</option>
        ${locations.map(l=>`<option value="${l.id}" ${locFilter===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
      </select>
      <button class="btn-ghost" id="exportTicketsCsv" style="margin-left:auto;">Export CSV</button>
    </div>
    <div id="ticketList"></div>
  `;
  document.getElementById('statusFilter').value = statusFilter;
  document.getElementById('locFilter').value = locFilter;
  document.getElementById('statusFilter').onchange = e => { statusFilter = e.target.value; renderTicketsTab(); };
  document.getElementById('locFilter').onchange = e => { locFilter = e.target.value; renderTicketsTab(); };
  document.getElementById('exportTicketsCsv').onclick = () => exportCsv('tickets',
    ['id','locationName','assetName','reporterName','department','category','urgency','status','assignedTo','description','createdAt','dueBy'], tickets);

  let filtered = tickets;
  if (statusFilter !== 'all') filtered = filtered.filter(t => t.status === statusFilter);
  if (locFilter !== 'all') filtered = filtered.filter(t => t.locationId === locFilter);

  const list = document.getElementById('ticketList');
  if (!filtered.length) { list.innerHTML = `<div class="empty">No tickets match this filter.</div>`; return; }

function toCsvValue(v){
  const s = v == null ? '' : String(v);
  return '"' + s.replace(/"/g,'""') + '"';
}
async function exportCsv(name, cols, rows){
  const lines = [cols.join(',')];
  rows.forEach(r => {
    lines.push(cols.map(c => {
      let v = r[c];
      if (c === 'createdAt' || c === 'dueBy') v = v ? new Date(v).toISOString() : '';
      return toCsvValue(v);
    }).join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.csv';
  a.click();
}

function monthKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-');
  return new Date(y, m-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
}

let reportRange = '30';
function bars(obj){
  const keys = Object.keys(obj).sort((a,b) => obj[b]-obj[a]);
  const max = Math.max(1, ...keys.map(k => obj[k]));
  return keys.map(k => `<div class="bar-row"><span>${escapeHtml(k)}</span><div class="bar"><i style="width:${obj[k]/max*100}%"></i></div><b>${obj[k]}</b></div>`).join('') || '<div class="ticket-meta">No data</div>';
}
function fmtDuration(ms){
  const h = ms/3600000;
  return h < 1 ? Math.round(h*60) + 'm' : h < 48 ? h.toFixed(1) + 'h' : (h/24).toFixed(1) + 'd';
}

async function renderReportsTab(){
  const body = document.getElementById('tabBody');
  const all = await fetchAll('tickets');
  const cutoff = reportRange === 'all' ? 0 : Date.now() - (+reportRange) * 86400000;
  const tickets = all.filter(t => (t.createdAt||0) >= cutoff);
  const rangeSel = `<select id="rangeSel" style="width:auto;">
      ${[['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['365','Last year'],['all','All time']].map(o=>`<option value="${o[0]}" ${reportRange===o[0]?'selected':''}>${o[1]}</option>`).join('')}
    </select>`;
  const bind = () => {
    document.getElementById('rangeSel').onchange = e => { reportRange = e.target.value; renderReportsTab(); };
    const ex = document.getElementById('exportFullCsv');
    if (ex) ex.onclick = () => exportCsv('tickets_report',
      ['id','locationName','assetName','reporterName','department','category','urgency','status','assignedTo','description','createdAt','dueBy'], tickets);
    const pr = document.getElementById('printBtn'); if (pr) pr.onclick = () => window.print();
  };
  if (!tickets.length) { body.innerHTML = `<div class="row" style="margin-bottom:14px;">${rangeSel}</div><div class="empty">No tickets in this period.</div>`; bind(); return; }

  const now = Date.now();
  const st = {open:0, 'in-progress':0, resolved:0, overdue:0};
  const byMonth = {}, byLoc = {}, byCat = {}, byUrg = {}, byDept = {};
  const durs = [];
  const blank = () => ({total:0, open:0, inprog:0, resolved:0});
  const bump = (m, k, t) => { m[k] = m[k] || blank(); m[k].total++; if (t.status==='resolved') m[k].resolved++; else if (t.status==='in-progress') m[k].inprog++; else m[k].open++; };
  tickets.forEach(t => {
    st[t.status] = (st[t.status]||0) + 1;
    if (t.status !== 'resolved' && t.dueBy && t.dueBy < now) st.overdue++;
    if (t.status === 'resolved' && t.resolvedAt && t.createdAt) durs.push(t.resolvedAt - t.createdAt);
    bump(byMonth, monthKey(t.createdAt || now), t);
    bump(byLoc, t.locationName || t.locationId || 'Unknown', t);
    byCat[t.category||'Other'] = (byCat[t.category||'Other']||0) + 1;
    byUrg[t.urgency||'Medium'] = (byUrg[t.urgency||'Medium']||0) + 1;
    if (t.department) byDept[t.department] = (byDept[t.department]||0) + 1;
  });
  const avg = durs.length ? fmtDuration(durs.reduce((a,b)=>a+b,0)/durs.length) : '—';
  const rate = Math.round((st.resolved / tickets.length) * 100);
  const th = 'text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--border);color:var(--muted);font-size:.78rem;font-weight:700;';
  const td = 'padding:9px 8px;border-bottom:1px solid var(--border);';
  const tbl = (first, map, keys) => `<div style="overflow-x:auto;"><table style="font-size:.85rem;">
    <thead><tr>${[first,'Total','Open','In Progress','Resolved'].map(h=>`<th style="${th}">${h}</th>`).join('')}</tr></thead>
    <tbody>${keys.map(k => { const r = map[k]; return `<tr><td style="${td}">${escapeHtml(first==='Month'?monthLabel(k):k)}</td><td style="${td}">${r.total}</td><td style="${td}">${r.open}</td><td style="${td}">${r.inprog}</td><td style="${td}">${r.resolved}</td></tr>`; }).join('')}</tbody></table></div>`;

  body.innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;">${rangeSel}
      <button class="btn-ghost" id="printBtn" style="margin-left:auto;">Print</button>
      <button class="btn-ghost" id="exportFullCsv">Export CSV</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${tickets.length}</b><span>Total tickets</span></div>
      <div class="stat"><b style="color:var(--danger)">${st.open||0}</b><span>Open</span></div>
      <div class="stat"><b style="color:var(--warn)">${st['in-progress']||0}</b><span>In progress</span></div>
      <div class="stat"><b style="color:var(--ok)">${st.resolved||0}</b><span>Resolved (${rate}%)</span></div>
      <div class="stat"><b style="color:var(--danger)">${st.overdue}</b><span>Overdue</span></div>
      <div class="stat"><b>${avg}</b><span>Avg. resolution</span></div>
    </div>
    <div class="two">
      <div class="card"><h2 class="ct">By category</h2>${bars(byCat)}</div>
      <div class="card"><h2 class="ct">By urgency</h2>${bars(byUrg)}</div>
    </div>
    ${Object.keys(byDept).length ? `<div class="card"><h2 class="ct">Top departments</h2>${bars(byDept)}</div>` : ''}
    <div class="card"><h2 class="ct">Monthly report</h2>${tbl('Month', byMonth, Object.keys(byMonth).sort().reverse())}</div>
    <div class="card"><h2 class="ct">Location report</h2>${tbl('Location', byLoc, Object.keys(byLoc).sort())}</div>
  `;
  bind();
}

function showQr(url = formUrl(), title = 'IT Issue Report Form', sub = ''){
  const bg = document.createElement('div');
  bg.className = 'qr-modal-bg';
  bg.innerHTML = `
    <div class="qr-modal">
      <h1 style="font-size:1.1rem;">${escapeHtml(title)}</h1>
      ${sub ? `<div class="ticket-meta" style="margin:-4px 0 12px;">${escapeHtml(sub)}</div>` : ''}
      <div id="qrCanvas"></div>
      <div class="url">${escapeHtml(url)}</div>
      <button class="link-btn" id="copyUrl">Copy link</button>
      <br><br>
      <button class="btn-ghost" id="printQr">Print label</button> <button class="btn-ghost" id="closeModal">Close</button>
    </div>
  `;
  document.body.appendChild(bg);
  const qrTarget = document.getElementById('qrCanvas');
  if (window.QRCode) {
    try {
      new QRCode(qrTarget, {text: url, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
    } catch(e) {
      qrTarget.innerHTML = '<div style="color:var(--danger);font-size:.8rem;">Could not render QR code. Use the link below instead.</div>';
    }
  } else {
    qrTarget.innerHTML = '<div style="color:var(--danger);font-size:.8rem;">QR library failed to load. Use the link below instead.</div>';
  }
  document.getElementById('printQr').onclick = () => {
    const c = qrTarget.querySelector('canvas'), im = qrTarget.querySelector('img');
    const src = c ? c.toDataURL() : (im ? im.src : '');
    const w = window.open('', '_blank'); if (!w) return;
    w.document.write(`<title>${escapeHtml(title)}</title><body style="font-family:sans-serif;text-align:center;margin:0;padding:16px"><div style="display:inline-block;border:2px solid #000;border-radius:10px;padding:14px;width:260px"><img src="${src}" style="width:220px;height:220px"><div style="font-weight:700;font-size:16px;margin-top:8px">${escapeHtml(title)}</div><div style="font-size:12px;margin-top:2px">${escapeHtml(sub)}</div></div><script>onload=function(){setTimeout(function(){print()},200)}<\/script></body>`);
    w.document.close();
  };
  document.getElementById('closeModal').onclick = () => bg.remove();
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.getElementById('copyUrl').onclick = () => {
    navigator.clipboard.writeText(url).then(()=>{ document.getElementById('copyUrl').textContent = 'Copied!'; });
  };
}

// ---------- ASSET PAGE (opened by scanning the QR label) ----------
const CONDITIONS = ["New","Good","Fair","Poor","Damaged"];
const condBadge = c => ({New:'badge-resolved',Good:'badge-resolved',Fair:'badge-in-progress'}[c] || 'badge-open');
function assetUrl(id){ return pageBaseUrl() + '?view=asset&id=' + encodeURIComponent(id); }

async function renderAssetPage(id){
  const app = document.getElementById('app');
  const $ = x => document.getElementById(x);
  const fail = (icon, t, m) => { app.innerHTML = `<div class="msg"><div class="big">${icon}</div><h1>${t}</h1><p class="sub">${m}</p></div>`; };
  if (!db) return fail('⚠️', "Can't connect", escapeHtml(dbError || 'Database not available.'));
  const [r, locations, tickets] = await Promise.all([id ? db.doc('assets/' + id).get() : null, fetchAll('locations'), fetchAll('tickets')]);
  if (!r || !r.data) return fail('🔍', 'Asset not found', 'This QR code may be for an asset that was removed.');
  const a = r.data;
  const cond = a.condition || 'Good';
  locations.sort((x,y) => (x.name||'').localeCompare(y.name||''));
  const hist = (a.history || []).slice();
  if (!hist.some(h => h.type === 'created')) hist.push({type:'created', at:a.createdAt || 0});
  hist.sort((x,y) => (y.at||0) - (x.at||0));
  const openT = tickets.filter(t => t.assetId === id && t.status !== 'resolved').length;
  const ICON = {created:'✨', repair:'🔧', transfer:'🔁', condition:'📋'};
  const title = h => h.type === 'created' ? 'Asset added'
    : h.type === 'repair' ? (h.outcome === 'completed' ? 'Repair completed' : 'Sent for repair') + (h.vendor ? ' · ' + h.vendor : '') + (h.cost ? ' · cost ' + h.cost : '')
    : h.type === 'transfer' ? 'Moved ' + (h.from ? 'from ' + h.from + ' ' : '') + 'to ' + h.to + (h.person ? ' · assigned to ' + h.person : '')
    : 'Condition ' + (h.from || '—') + ' → ' + h.to;

  app.innerHTML = `
    <div class="ticket-meta" style="margin-bottom:6px;">Asset details</div>
    <h1>${escapeHtml(a.name)}</h1>
    <div style="margin:8px 0 4px;">
      <span class="badge ${a.status==='Active'?'badge-resolved':a.status==='In Repair'?'badge-in-progress':'badge-open'}">${escapeHtml(a.status||'Active')}</span>
      <span class="badge ${condBadge(cond)}">Condition: ${escapeHtml(cond)}</span>
      ${openT ? `<span class="badge badge-open">${openT} open ticket${openT===1?'':'s'}</span>` : ''}
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="ticket-meta" style="margin:0;line-height:1.9;font-size:.88rem;">
        <b>Type:</b> ${escapeHtml(a.type||'—')}<br>
        <b>Location:</b> ${escapeHtml(a.locationName||'—')}<br>
        <b>Serial / tag:</b> ${escapeHtml(a.serial||'—')}<br>
        <b>Assigned to:</b> ${escapeHtml(a.assignedTo||'—')}<br>
        <b>Asset ID:</b> ${escapeHtml(a.id)}
      </div>
    </div>
    <div class="acts">
      <button class="btn-ghost" data-k="repair">🔧 Repair</button>
      <button class="btn-ghost" data-k="transfer">🔁 Transfer</button>
      <button class="btn-ghost" data-k="condition">📋 Condition</button>
    </div>
    <div id="panel"></div>
    <a class="btn-ghost" style="display:block;margin-bottom:18px;" href="${escapeHtml(formUrl() + '&asset=' + encodeURIComponent(id))}">Report an issue with this asset</a>
    <h1 style="font-size:1.05rem;margin-bottom:12px;">History</h1>
    <div class="card">${hist.map(h => `
      <div class="hist"><b>${ICON[h.type]||'•'} ${escapeHtml(title(h))}</b>
        ${h.note ? `<div class="ticket-desc" style="margin-top:4px;">${escapeHtml(h.note)}</div>` : ''}
        <div class="ticket-meta">${h.at ? new Date(h.at).toLocaleString() : ''}${h.by ? ' · ' + escapeHtml(h.by) : ''}</div>
      </div>`).join('')}
    </div>`;

  const forms = {
    repair: () => `<label>Repair status</label><select id="p_outcome"><option value="started">Sent / repair started</option><option value="completed">Repair completed</option></select>
      <label>Vendor / technician (optional)</label><input id="p_vendor" type="text">
      <label>Cost (optional)</label><input id="p_cost" type="number" min="0" inputmode="decimal">
      <label>Details</label><textarea id="p_note" placeholder="What was wrong / what was done?"></textarea>`,
    transfer: () => `<label>Move to location</label><select id="p_loc">${locations.map(l=>`<option value="${l.id}" ${l.id===a.locationId?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>
      <label>Assigned to (optional)</label><input id="p_person" type="text" value="${escapeHtml(a.assignedTo||'')}">
      <label>Note</label><textarea id="p_note" placeholder="Reason for transfer"></textarea>`,
    condition: () => `<label>Condition</label><select id="p_cond">${CONDITIONS.map(c=>`<option value="${c}" ${c===cond?'selected':''}>${c}</option>`).join('')}</select>
      <label>Note</label><textarea id="p_note" placeholder="e.g. cracked screen, battery weak"></textarea>`
  };
  app.querySelectorAll('.acts button').forEach(b => b.onclick = () => {
    app.querySelectorAll('.acts button').forEach(x => x.classList.toggle('on', x === b));
    const kind = b.dataset.k;
    $('panel').innerHTML = `<div class="card">${forms[kind]()}
      <label>Your name</label><input id="p_by" type="text" value="${escapeHtml(lsGet('it_by')||'')}">
      <button class="btn-primary" id="p_save">Save</button><div id="p_msg" class="ticket-meta" style="margin-top:10px;"></div></div>`;
    $('p_save').onclick = async () => {
      const by = $('p_by').value.trim(); lsSet('it_by', by);
      const entry = {type:kind, at:Date.now(), by, note: $('p_note').value.trim()};
      const upd = {};
      if (kind === 'repair') {
        entry.outcome = $('p_outcome').value; entry.vendor = $('p_vendor').value.trim(); entry.cost = $('p_cost').value;
        upd.status = entry.outcome === 'completed' ? 'Active' : 'In Repair';
      } else if (kind === 'transfer') {
        const loc = locations.find(l => l.id === $('p_loc').value);
        const person = $('p_person').value.trim();
        if (!loc || (loc.id === a.locationId && person === (a.assignedTo||''))) { $('p_msg').textContent = 'Pick a different location or person.'; return; }
        entry.from = a.locationName || ''; entry.to = loc.name; entry.person = person;
        Object.assign(upd, {locationId: loc.id, locationName: loc.name, assignedTo: person});
      } else {
        entry.from = cond; entry.to = $('p_cond').value; upd.condition = entry.to;
        if (entry.to === cond && !entry.note) { $('p_msg').textContent = 'Change the condition or add a note.'; return; }
      }
      upd.history = [...(a.history || []), entry];
      $('p_save').disabled = true; $('p_save').textContent = 'Saving…';
      try { await db.doc('assets/' + id).update(upd); await renderAssetPage(id); }
      catch(e){ $('p_save').disabled = false; $('p_save').textContent = 'Save'; $('p_msg').style.color = 'var(--danger)'; $('p_msg').textContent = "Couldn't save — check your connection."; }
    };
  });
}

// ---------- helpers ----------
function label(s){ return s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' '); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

init();
</script>
